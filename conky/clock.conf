conky.config = {
    alignment = 'top_middle',
    gap_y = 80,
    minimum_width = 4800,
    maximum_width = 480,
    update_interval =1,
    double_buffer = true,

    own_window = true,
    own_window_argb_visual = true,
    own_window_argb_value = 100,
    own_window_transparent = false,
    own_window_colour = '202020',
    own_window_type = 'override',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    use_xft = true,
    font = 'DejaVu Sans Mono:size-32',
    default_color = 'white',
    text_buffer_size = 256,
}

conky.text = [[
${alignc}${font DejaVu Sans Mono:bold:size=70}${time %H:%M:%S}${font}

${alignc}${font DejaVu Sans Mono:size=20}${time %A, %d.%m.%y}${font}
]]
